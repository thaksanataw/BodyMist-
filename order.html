<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-layout { max-width: 560px; margin: 0 auto; }
    .field textarea#items { min-height: 80px; }
    .form .btn { justify-self: start; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="order-layout">
          <div class="section-head">
            <h1>สั่งซื้อสินค้า</h1>
            <span class="mood-rule"></span>
            <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อและแจ้งวิธีชำระเงิน</p>
          </div>

          <form id="orderForm" class="form">
            <div class="field">
              <label for="customerName">ชื่อลูกค้า</label>
              <input type="text" id="customerName" name="customerName" autocomplete="name" required>
            </div>

            <div class="field">
              <label for="contact">เบอร์โทร / Line</label>
              <input type="text" id="contact" name="contact" autocomplete="tel" required>
            </div>

            <div class="field">
              <label for="items">รายการสินค้า</label>
              <textarea id="items" name="items" rows="2" required></textarea>
            </div>

            <div class="field">
              <label for="total">จำนวนเงินรวม (บาท)</label>
              <input type="number" id="total" name="total" min="0" inputmode="numeric" required>
            </div>

            <div class="field">
              <label for="note">หมายเหตุ</label>
              <textarea id="note" name="note" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
